[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quant-evo"
version = "0.1.0"
description = "Evolutionary mixed-precision bit allocation for LLM quantization (NSGA-II)"
requires-python = ">=3.10"
dependencies = [
  "PyYAML>=6.0.1",
  "numpy>=1.26",
  "pandas>=2.2",
  "matplotlib>=3.8",
  "tqdm>=4.66",
  "sqlalchemy>=2.0",
  "scipy>=1.11",
  "tabulate>=0.9",
]
